<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>요양(병)원 대피체계 시설지도</title>
<link rel="stylesheet" href="css/style.css">
<!-- 아래 YOUR_KAKAO_JAVASCRIPT_KEY를 카카오 JavaScript 키로 교체하세요. -->
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=YOUR_KAKAO_JAVASCRIPT_KEY&libraries=services"></script>
</head><body>
<header><div><h1>요양(병)원 시설 현황 지도</h1><small>요양(병)원 시설 유형별 대피체계 표준모델 개발</small></div>
<div class="search"><input id="search" placeholder="시설명 검색"><button id="searchBtn">검색</button><button id="resetBtn">전국보기</button></div></header>
<main>
<aside class="filters"><h3>레이어 / 필터</h3>
<label>시·도<select id="sido"><option value="">전체</option></select></label>
<label>시·군·구<select id="sigungu"><option value="">전체</option></select></label>
<label>시설유형<select id="facilityType"><option value="">전체</option></select></label>
<label>입지유형<select id="locationType"><option value="">전체</option></select></label>
<label>산림인접유형<select id="forestType"><option value="">전체</option></select></label>
<label>건축유형<select id="buildingType"><option value="">전체</option></select></label>
<label>규모유형<select id="scaleType"><option value="">전체</option></select></label>
<hr><label class="check"><input type="checkbox" id="showFire" checked> 선택 시설의 지정 소방기관 표시</label>
<div id="count" class="count"></div></aside>
<section id="map"></section>
<aside id="detail"><h3>시설 상세정보</h3><div id="detailBody">지도에서 시설을 선택하세요.</div></aside>
</main>
<script src="js/config.js"></script><script src="js/app.js"></script></body></html>
