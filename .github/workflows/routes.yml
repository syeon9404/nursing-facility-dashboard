name: Update designated fire station routes
on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximum API requests (1–1000)'
        default: '100'
        required: true
      facility_id:
        description: 'Optional facility ID to refresh (e.g. H0001)'
        default: ''
permissions:
  contents: write
concurrency:
  group: fire-routes
  cancel-in-progress: false
jobs:
  routes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve missing designated station coordinates
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
        run: python scripts/resolve_stations.py
      - name: Fetch designated station routes
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          ROUTE_LIMIT: ${{ inputs.limit }}
          FACILITY_ID: ${{ inputs.facility_id }}
        run: python scripts/update_routes.py --limit "$ROUTE_LIMIT" --facility-id "$FACILITY_ID"
      - name: Save routes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add routes data/map
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update routes from designated fire stations'
          git pull --rebase origin main
          git push origin HEAD:main
